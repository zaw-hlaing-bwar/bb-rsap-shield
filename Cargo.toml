[workspace]
resolver = "2"
members = [
  "crates/rasp-cli",
  "crates/rasp-core",
  "crates/rasp-config",
  "crates/rasp-report",
  "crates/artifact-inspector",
  "crates/android-axml",
  "crates/android-dex",
  "crates/android-apk",
  "crates/android-signing",
  "crates/payload-pack",
  "crates/runtime-test",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "LicenseRef-Proprietary"
authors = ["RASP Shield Contributors"]
publish = false

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
